[package]
name = "magi-linear-axi"
version = "0.1.1"
edition = "2024"
rust-version = "1.87"
license = "ISC"
description = "Agent-native Linear GraphQL CLI with TOON output"
repository = "https://github.com/magimetal/magi-linear-axi"
homepage = "https://github.com/magimetal/magi-linear-axi"
readme = "README.md"
documentation = "https://docs.rs/magi-linear-axi"
keywords = ["linear", "graphql", "cli", "agents", "toon"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/src/**",
  "/tests/**",
  "/skills/**",
  "/docs/release.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
  "/README.md",
  "/CHANGELOG.md",
  "/Cargo.lock",
]
[[bin]]
name = "magi-linear-axi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
toon-format = { version = "0.5", default-features = false }
url = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
