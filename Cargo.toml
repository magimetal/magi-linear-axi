[package]
name = "magi-linear-axi"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "ISC"
description = "Agent-native Linear GraphQL CLI with TOON output"

[[bin]]
name = "magi-linear-axi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
toon-format = "0.5"
url = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
